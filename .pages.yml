# Pages CMS (app.pagescms.org) – the editing screens. Kept deliberately small:
# products (add / delete / name, photo, prices) and contact details. Everything else
# (boxes, categories, texts) is edited in the code.
# Fields marked "hidden" are not shown, but are kept so a save never loses them.
# The media tab shows only images/products. A product photo that nothing uses any more
# is removed automatically after a product change (.github/workflows/remove-unused-photos.yml).

media:
  input: images/products
  output: /images/products
  categories: [image]
  rename: random

content:
  - name: products
    label: מוצרים
    type: collection
    path: _products
    format: yaml-frontmatter
    filename:
      template: "product-{year}{month}{day}-{hour}{minute}{second}.md"
      field: false
    view:
      primary: name
      fields: [name]
      search: [name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: שם המוצר
        type: string
        required: true
      - name: image
        label: תמונה
        description: תמונה ריבועית נראית הכי טוב. בלי תמונה יופיע ריבוע ורוד עם שם המוצר.
        type: image
      - name: variations
        label: מחירים
        description: שורה לכל גודל או כמות. בלי מחיר בכלל – יופיע "מחיר בתיאום".
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{name} – {price} ₪"
        fields:
          - name: name
            label: גודל / כמות
            description: למשל "פס", "עיגול קוטר 26", "10 יחידות"
            type: string
            required: true
          - name: price
            label: מחיר
            description: מספר בלבד, בלי ₪
            type: number
            required: true
            options:
              min: 0
          - { name: label, type: string, hidden: true }
          - { name: note, type: string, hidden: true }
          - { name: image, type: image, hidden: true }
      - name: description
        label: הערה קצרה (לא חובה)
        description: למשל "פרווה."
        type: text

      # not shown – kept as they are
      - { name: category, type: string, hidden: true, default: _product_groups/photos.md }
      - { name: gallery, type: image, hidden: true, options: { multiple: true } }
      - { name: price, type: number, hidden: true }
      - { name: flavors_title, type: string, hidden: true }
      - name: flavors
        type: object
        list: true
        hidden: true
        fields:
          - { name: name, type: string }
          - { name: image, type: image }
      - { name: flavors_from_crumbl, type: boolean, hidden: true }
      - { name: box_card, type: boolean, hidden: true }
      - { name: tag, type: string, hidden: true }
      - { name: visible, type: boolean, hidden: true, default: true }
      - { name: order, type: number, hidden: true }

  - name: contact
    label: פרטי קשר
    type: file
    path: _data/contact.yml
    format: yaml
    fields:
      - name: whatsapp
        label: מספר וואטסאפ להזמנות
        description: מתחילים ב-972 ואחריו המספר בלי ה-0 הראשון. למשל 0586071206 ← 972586071206
        type: string
        required: true
        pattern:
          regex: "^972[0-9]{8,9}$"
          message: מתחילים ב-972, ואחריו המספר בלי ה-0 הראשון. בלי רווחים ומקפים.
      - name: phone_display
        label: הטלפון כמו שהוא מופיע באתר
        description: למשל 058-607-1206
        type: string
        required: true
      - name: hours
        label: שעות פעילות
        type: string
      - name: area
        label: אזור איסוף ומשלוחים
        type: string
      - name: instagram
        label: אינסטגרם (לא חובה)
        description: שם המשתמש בלי @
        type: string
      - name: email
        label: מייל (לא חובה)
        type: string
      - name: pickup_map
        label: קישור למקום האיסוף בגוגל מפות (לא חובה)
        type: string
